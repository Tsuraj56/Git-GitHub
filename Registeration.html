<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome back | Sign in</title>
	<style>
		:root {
			--ink: #17231f;
			--muted: #6c7974;
			--line: #dce5df;
			--paper: #fbfcf9;
			--accent: #176b5b;
			--accent-dark: #0e5145;
			--soft: #e8f2ec;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 18px;
			color: var(--ink);
			background:
				radial-gradient(circle at 8% 12%, #d9eee1 0, transparent 26%),
				radial-gradient(circle at 92% 88%, #f3e4c9 0, transparent 28%),
				#f4f7f2;
			font-family: Georgia, 'Times New Roman', serif;
		}

		.shell {
			width: min(100%, 980px);
			display: grid;
			grid-template-columns: 0.9fr 1.1fr;
			overflow: hidden;
			border: 1px solid rgba(23, 35, 31, 0.08);
			border-radius: 18px;
			background: var(--paper);
			box-shadow: 0 24px 70px rgba(31, 54, 43, 0.14);
		}

		.welcome {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-height: 580px;
			padding: 48px;
			color: #f4fbf5;
			background: linear-gradient(145deg, #176b5b, #103f38);
		}

		.mark {
			width: 42px;
			height: 42px;
			display: grid;
			place-items: center;
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 50%;
			font-size: 20px;
		}

		.welcome h1 {
			max-width: 310px;
			margin: 0 0 18px;
			font-size: clamp(2.5rem, 5vw, 4.1rem);
			font-weight: 400;
			line-height: 0.98;
			letter-spacing: -1.5px;
		}

		.welcome p {
			max-width: 300px;
			margin: 0;
			color: #c5ddd1;
			font: 16px/1.6 Arial, sans-serif;
		}

		.quote {
			margin: 0;
			padding-top: 24px;
			border-top: 1px solid rgba(255, 255, 255, 0.22);
			color: #c5ddd1;
			font: 13px/1.5 Arial, sans-serif;
		}

		.form-panel {
			display: flex;
			align-items: center;
			padding: 56px clamp(28px, 7vw, 78px);
		}

		form { width: 100%; }

		.eyebrow {
			margin: 0 0 10px;
			color: var(--accent);
			font: 700 12px/1 Arial, sans-serif;
			letter-spacing: 1.8px;
			text-transform: uppercase;
		}

		.form-panel h2 {
			margin: 0 0 10px;
			font-size: clamp(2rem, 4vw, 2.8rem);
			font-weight: 400;
			letter-spacing: -1px;
		}

		.intro {
			margin: 0 0 34px;
			color: var(--muted);
			font: 14px/1.5 Arial, sans-serif;
		}

		.field { margin-bottom: 22px; }

		label {
			display: block;
			margin-bottom: 8px;
			font: 700 13px Arial, sans-serif;
		}

		input[type="email"], input[type="password"], input[type="text"] {
			width: 100%;
			padding: 14px 15px;
			border: 1px solid var(--line);
			border-radius: 8px;
			outline: none;
			color: var(--ink);
			background: #fff;
			font: 15px Arial, sans-serif;
			transition: border-color 160ms, box-shadow 160ms;
		}

		input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(23, 107, 91, 0.12);
		}

		.password-wrap { position: relative; }
		.password-wrap input { padding-right: 70px; }

		.show-password {
			position: absolute;
			top: 50%;
			right: 10px;
			transform: translateY(-50%);
			border: 0;
			color: var(--accent);
			background: transparent;
			cursor: pointer;
			font: 700 12px Arial, sans-serif;
		}

		.options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 2px 0 28px;
			font: 13px Arial, sans-serif;
		}

		.remember { display: flex; align-items: center; gap: 8px; color: var(--muted); }
		.remember input { accent-color: var(--accent); }
		a { color: var(--accent); font-weight: 700; text-decoration: none; }
		a:hover { text-decoration: underline; }

		.submit {
			width: 100%;
			padding: 15px;
			border: 0;
			border-radius: 8px;
			color: white;
			background: var(--accent);
			cursor: pointer;
			font: 700 14px Arial, sans-serif;
			transition: background 160ms, transform 160ms;
		}

		.submit:hover { background: var(--accent-dark); transform: translateY(-1px); }
		.submit:focus-visible, .show-password:focus-visible, a:focus-visible { outline: 3px solid #e2b867; outline-offset: 3px; }

		.register {
			margin: 28px 0 0;
			color: var(--muted);
			text-align: center;
			font: 13px Arial, sans-serif;
		}

		@media (max-width: 700px) {
			.shell { grid-template-columns: 1fr; }
			.welcome { min-height: auto; padding: 32px; gap: 54px; }
			.welcome h1 { font-size: 3rem; }
			.quote { display: none; }
			.form-panel { padding: 42px 28px 48px; }
		}
	</style>
</head>
<body>
	<main class="shell">
		<section class="welcome" aria-label="Welcome message">
			<div class="mark" aria-hidden="true">✦</div>
			<div>
				<h1>Good to see you again.</h1>
				<p>Your space is ready. Sign in to continue where you left off.</p>
			</div>
			<p class="quote">“Small steps every day add up to remarkable things.”</p>
		</section>

		<section class="form-panel">
			<form action="#" method="post">
				<p class="eyebrow">Member access</p>
				<h2>Welcome back</h2>
				<p class="intro">Enter your details to access your account.</p>

				<div class="field">
					<label for="email">Email address</label>
					<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
				</div>

				<div class="field">
					<label for="password">Password</label>
					<div class="password-wrap">
						<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
						<button class="show-password" type="button" aria-label="Show password">Show</button>
					</div>
				</div>

				<div class="options">
					<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
					<a href="#forgot-password">Forgot password?</a>
				</div>

				<button class="submit" type="submit">Sign in</button>
				<p class="register">New here? <a href="Registeration.html">Create an account</a></p>
			</form>
		</section>
	</main>

	<script>
		const password = document.querySelector('#password');
		const toggle = document.querySelector('.show-password');

		toggle.addEventListener('click', () => {
			const isVisible = password.type === 'text';
			password.type = isVisible ? 'password' : 'text';
			toggle.textContent = isVisible ? 'Show' : 'Hide';
			toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
		});
	</script>
</body>
</html>
